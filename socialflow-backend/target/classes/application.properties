# Application Configuration
spring.application.name=socialflow-backend
server.port=${PORT:8080}

# File Upload Configuration
socialflow.upload.temp-dir=${SOCIALFLOW_TEMP_UPLOAD_DIR:uploads/temp}
socialflow.upload.scheduled-dir=${SOCIALFLOW_SCHEDULED_UPLOAD_DIR:uploads/scheduled}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# MySQL Database Configuration (Environment variables with sensible defaults)
spring.datasource.url=jdbc:mysql://localhost:3306/socialflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=socialflow_user
spring.datasource.password=socialflow123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1e3b5d7f9a2c4e6b8d0e1f3a5c7b9d2e4f}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ==========================================================
# Hugging Face AI Configuration
# Set HF_TOKEN environment variable — NEVER commit real tokens
# ==========================================================
huggingface.api.token=${HF_TOKEN:}
huggingface.api.base-url=https://router.huggingface.co/v1
huggingface.model=openai/gpt-oss-120b:preferred

# ==========================================================
# Social Media OAuth Configuration
# Set these as environment variables — NEVER commit real secrets
# ==========================================================

# Meta (Instagram + Facebook) — COMING SOON
# Keep configured for future Meta Business verification
meta.app.id=${META_APP_ID:}
meta.app.secret=${META_APP_SECRET:}
meta.redirect.uri=${META_REDIRECT_URI:http://localhost:8080/api/social-accounts/INSTAGRAM/callback}

# X (Twitter) — ACTIVE
# Register at: https://developer.twitter.com/
# Required: "Read and Write" permissions, tweet.write + users.read + offline.access scopes
x.client.id=${X_CLIENT_ID:}
x.client.secret=${X_CLIENT_SECRET:}
x.redirect.uri=${X_REDIRECT_URI:http://localhost:8080/api/social-accounts/TWITTER/callback}

# Google (YouTube) — ACTIVE
# Register at: https://console.cloud.google.com/
# Required: YouTube Data API v3 enabled, youtube.upload + youtube scopes
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/social-accounts/YOUTUBE/callback}

# LinkedIn — ACTIVE
# Register at: https://www.linkedin.com/developers/apps
# Required product: "Share on LinkedIn"
# Required scopes: openid, profile, w_member_social
# Required redirect URI must be registered in the LinkedIn app settings
linkedin.client.id=${LINKEDIN_CLIENT_ID:}
linkedin.client.secret=${LINKEDIN_CLIENT_SECRET:}
linkedin.redirect.uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/social-accounts/LINKEDIN/callback}
